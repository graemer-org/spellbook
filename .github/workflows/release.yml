name: Release

# Pushing a tag like v1.2.3 builds the archives, publishes a GitHub release
# and updates the Homebrew formula on main.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archives and formula
        run: scripts/release.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update formula on main
        run: |
          cp Formula/spellbook.rb "$RUNNER_TEMP/spellbook.rb"
          git checkout --force main
          mkdir -p Formula
          cp "$RUNNER_TEMP/spellbook.rb" Formula/spellbook.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spellbook.rb
          git commit -m "Update Homebrew formula to $GITHUB_REF_NAME"
          git push origin main
