name: Release

# release-please keeps a release pull request up to date from the
# Conventional Commits on main. Merging that pull request creates the tag
# and a draft of the GitHub release. The publish job adds the archives,
# publishes the release and updates the Homebrew formula. The order
# matters: a published release is immutable and takes no more files.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Named explicitly so releases do not depend on which branch is
          # the repository's default.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit, not the tag: the tag of a draft release may not
          # exist before the release is published.
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archives and formula
        run: scripts/release.sh "$TAG"
      - name: Add archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
      - name: Update formula on main
        run: |
          cp Formula/spellbook.rb "$RUNNER_TEMP/spellbook.rb"
          git checkout --force main
          git pull --ff-only origin main
          mkdir -p Formula
          cp "$RUNNER_TEMP/spellbook.rb" Formula/spellbook.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spellbook.rb
          git commit -m "chore: update Homebrew formula to $TAG"
          git push origin main
